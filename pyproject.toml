[project]
name = "harness"
version = "0.1.0"
description = "Testbed for how subagent return size and format shape accuracy and token cost in multi-agent search"
requires-python = ">=3.11"
dependencies = [
  "openai>=3.0",
  "pydantic>=2.7",
  "tokenizers>=0.20",
  "tiktoken>=0.8",
]

[project.optional-dependencies]
bm25 = ["pyserini>=0.44"]  # the official BrowseComp-Plus BM25 index; needs Java 21
data = ["huggingface_hub>=0.24", "pyarrow>=15"]  # python -m harness.data
analysis = ["matplotlib>=3.8"]  # plots from python -m harness.analyze
dev = ["pytest>=8", "httpx2"]  # httpx2 is the openai SDK's HTTP client; tests mock it

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["prompts.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not index'"
markers = [
  "live: calls a real model endpoint and spends tokens",
  "index: searches the official BM25 index; needs the bm25 extra, Java 21 and data/",
]
